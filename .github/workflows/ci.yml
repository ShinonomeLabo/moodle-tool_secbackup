name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rules:
    name: Commit rules and development tools
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # On a pull request, GitHub checks out a merge commit of its own by default. The commit rules apply to the commits of
      # the pull request, so its head is checked out. On a push both values are empty and the default stays.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Write the pattern list from the secret
        id: patterns
        env:
          SECBACKUP_PATTERNS: ${{ secrets.SECBACKUP_PATTERNS }}
        run: |
          if [ -z "$SECBACKUP_PATTERNS" ]; then
            {
              echo "The secret SECBACKUP_PATTERNS is missing, so the commit rules cannot run."
              echo "This is expected for a pull request from a fork: GitHub gives no secret to such a pull request."
              echo "The maintainers run the commit rules themselves before they take the commits."
              echo "The checks of the plugin itself are in the jobs named Moodle ..., which do not need the secret."
            } >&2
            exit 1
          fi
          printf '%s\n' "$SECBACKUP_PATTERNS" > .dev/hooks/patterns.local

      - name: Test the commit rules
        run: bash .dev/hooks/tests/run.sh

      - name: Check every commit
        run: bash .dev/hooks/check-history.sh

      # The files of every commit, their names and the tags. It runs also when the step above failed, so that one run shows
      # both results. The log names the commit, the file and the number of lines, never a line or a word of the list.
      - name: Check the files of every commit and the tags
        if: ${{ !cancelled() && steps.patterns.outcome == 'success' }}
        run: bash .dev/hooks/check-contents.sh

      - name: Check the pull request title and description
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pull-request.txt"
          source .dev/hooks/lib/rules.sh
          secbackup_check_message "$RUNNER_TEMP/pull-request.txt"

      # The steps below need no secret, so they also run when the one above failed.
      - name: Check that the development scripts cannot be run from the web
        if: ${{ !cancelled() }}
        run: bash .dev/hooks/check-dev-guards.sh

      - name: Test the coverage tools and the badge
        if: ${{ !cancelled() }}
        run: |
          php .dev/coverage/tests/run.php
          php .dev/coverage/tests/badge.php

  inventory:
    name: UI inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      # No secret is needed here, so a pull request from a fork gets this check too.
      - name: Check that every page and operation has a Behat scenario
        run: php .dev/ci/check-ui-inventory.php

      - name: Test the check
        run: bash .dev/hooks/tests/run.sh

  test:
    name: Moodle ${{ matrix.moodle }} PHP ${{ matrix.php }} ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - {moodle: '4.5', branch: MOODLE_405_STABLE, php: '8.3', database: pgsql, image: 'postgres:13', health: 'pg_isready -U postgres'}
          - {moodle: '4.5', branch: MOODLE_405_STABLE, php: '8.3', database: mariadb, image: 'mariadb:10.6.7', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '4.5', branch: MOODLE_405_STABLE, php: '8.3', database: mysqli, image: 'mysql:8.0', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '4.5', branch: MOODLE_405_STABLE, php: '8.1', database: pgsql, image: 'postgres:13', health: 'pg_isready -U postgres'}
          - {moodle: '5.0', branch: MOODLE_500_STABLE, php: '8.4', database: pgsql, image: 'postgres:14', health: 'pg_isready -U postgres'}
          - {moodle: '5.0', branch: MOODLE_500_STABLE, php: '8.4', database: mariadb, image: 'mariadb:10.11', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '5.1', branch: MOODLE_501_STABLE, php: '8.4', database: pgsql, image: 'postgres:15', health: 'pg_isready -U postgres'}
          - {moodle: '5.1', branch: MOODLE_501_STABLE, php: '8.4', database: mariadb, image: 'mariadb:10.11', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '5.1', branch: MOODLE_501_STABLE, php: '8.4', database: mysqli, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '5.1', branch: MOODLE_501_STABLE, php: '8.2', database: pgsql, image: 'postgres:15', health: 'pg_isready -U postgres'}
          - {moodle: '5.2', branch: MOODLE_502_STABLE, php: '8.4', database: pgsql, image: 'postgres:16', health: 'pg_isready -U postgres'}
          - {moodle: '5.2', branch: MOODLE_502_STABLE, php: '8.4', database: mariadb, image: 'mariadb:10.11', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '5.2', branch: MOODLE_502_STABLE, php: '8.4', database: mysqli, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '5.2', branch: MOODLE_502_STABLE, php: '8.3', database: pgsql, image: 'postgres:16', health: 'pg_isready -U postgres'}
          - {moodle: '5.3', branch: MOODLE_503_STABLE, php: '8.4', database: pgsql, image: 'postgres:17', health: 'pg_isready -U postgres'}
          - {moodle: '5.3', branch: MOODLE_503_STABLE, php: '8.4', database: mariadb, image: 'mariadb:11.4', health: 'mariadb-admin ping -h 127.0.0.1'}
          - {moodle: '5.3', branch: MOODLE_503_STABLE, php: '8.4', database: mysqli, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '5.3', branch: MOODLE_503_STABLE, php: '8.3', database: pgsql, image: 'postgres:17', health: 'pg_isready -U postgres'}

    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 5432:5432
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: pcov

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle with the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.branch }}

      - name: Add the development settings and start the fake service
        run: |
          moodle-plugin-ci add-config 'define("TOOL_SECBACKUP_DEVELOPER", ["trustedkeys" => ["PUAXw+hDiVqStwqnTRt+vJyYLM8uxJaMwM1V8Sr0Zgw="], "allowhttp" => true, "allowprivatehosts" => true, "skipnetworkchecks" => true]);'
          nohup php -S 127.0.0.1:8099 plugin/.dev/fakesec/router.php > "$RUNNER_TEMP/fakesec.log" 2>&1 &
          for _ in $(seq 1 20); do
            if php -r 'exit(@file_get_contents("http://127.0.0.1:8099/_fake/state") === false ? 1 : 0);'; then
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/fakesec.log"
          exit 1

      # moodle-plugin-ci install prepares the PHPUnit and Behat sites only. The command line scripts and the reinstall below
      # need the site itself, so it is installed here (the Behat and PHPUnit sites have their own table prefixes).
      - name: Install the site itself
        run: |
          if [ -f moodle/admin/cli/install_database.php ]; then cli=moodle/admin/cli; else cli=moodle/public/admin/cli; fi
          # A password made for this run only; it is not printed.
          php "$cli/install_database.php" --agree-license --fullname="Plugin CI" --shortname=plugin-ci \
            --summary="tool_secbackup" --adminpass="$(openssl rand -hex 16)" --adminemail=admin@example.com

      - name: Turn the coverage collector on and install the plugin again with it
        run: |
          mkdir -p plugin/.dev/coverage/out/raw
          touch plugin/.dev/coverage/out/raw/ENABLED
          scan="$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')"
          # OPcache is off, as in .dev/coverage/run.sh: with it on, pcov counts lines that PHPUnit never counts (for example the
          # defined('MOODLE_INTERNAL') line of settings.php), and the denominator of the web runs differs from the CLI runs.
          printf 'auto_prepend_file=%s\npcov.directory=%s\nopcache.enable=0\nopcache.enable_cli=0\n' \
            "$GITHUB_WORKSPACE/plugin/.dev/coverage/collector.php" "$GITHUB_WORKSPACE/moodle" \
            | sudo tee "$scan/zz-secbk-coverage.ini"
          if [ -f moodle/admin/cli/upgrade.php ]; then cli=moodle/admin/cli; else cli=moodle/public/admin/cli; fi
          SECBK_COVERAGE_CLI=1 php "$cli/uninstall_plugins.php" --plugins=tool_secbackup --run
          SECBK_COVERAGE_CLI=1 php "$cli/upgrade.php" --non-interactive

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning --coverage-pcov --coverage-clover

      # The Behat site is served by the web server of PHP, which has one worker unless it is told otherwise, and a page of
      # Moodle asks for many files and AJAX calls at once, so the server gets several workers.
      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        env:
          PHP_CLI_SERVER_WORKERS: '4'
        run: moodle-plugin-ci behat --profile chrome --auto-rerun 0

      # Every run has its own expected exit code (0: ok or help, 1: an unknown option or a wrong URL). Any other code, 255
      # above all, is a PHP fatal error, and it fails the step even when the lines were covered by another combination.
      - name: Command line scripts
        if: ${{ !cancelled() }}
        run: |
          if [ -d moodle/public ]; then cli=moodle/public/admin/tool/secbackup/cli/diagnose.php; else cli=moodle/admin/tool/secbackup/cli/diagnose.php; fi
          failed=0
          check() {
            local expected="$1" code=0
            shift
            SECBK_COVERAGE_CLI=1 php "$cli" "$@" || code=$?
            if [ "$code" != "$expected" ]; then
              echo "diagnose.php $* ended with exit code $code, expected $expected" >&2
              failed=1
            fi
          }
          check 0 --help
          check 1 --no-such-option
          check 0 --endpoint=http://localhost:8099/api/lms-backup/v1
          check 1 --endpoint=ftp://example.org/api
          check 0
          exit "$failed"

      - name: Keep the coverage of this combination
        if: ${{ !cancelled() }}
        run: |
          rm -f plugin/.dev/coverage/out/raw/ENABLED
          mkdir -p "$RUNNER_TEMP/coverage"
          cp coverage.xml "$RUNNER_TEMP/coverage/phpunit.xml"
          cp plugin/.dev/coverage/out/raw/*.json "$RUNNER_TEMP/coverage/"

      - name: Upload the coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-run-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.database }}
          path: ${{ runner.temp }}/coverage
          retention-days: 7

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Behat Faildump Moodle ${{ matrix.moodle }} PHP ${{ matrix.php }} ${{ matrix.database }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1

  # Behat in Firefox and Edge, in every Moodle version with both databases. The Chrome run, with the coverage, is in the
  # test job. A scenario has to pass the first time (--auto-rerun 0). No secret and no coverage here.
  behat:
    name: Behat ${{ matrix.browser }} Moodle ${{ matrix.moodle }} PHP ${{ matrix.php }} ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, edge]
        moodle: ['4.5', '5.0', '5.1', '5.2', '5.3']
        database: [pgsql, mariadb]
        include:
          - {moodle: '4.5', database: pgsql, branch: MOODLE_405_STABLE, php: '8.3', image: 'postgres:13', health: 'pg_isready -U postgres'}
          - {moodle: '4.5', database: mariadb, branch: MOODLE_405_STABLE, php: '8.3', image: 'mariadb:10.6.7', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '5.0', database: pgsql, branch: MOODLE_500_STABLE, php: '8.4', image: 'postgres:14', health: 'pg_isready -U postgres'}
          - {moodle: '5.0', database: mariadb, branch: MOODLE_500_STABLE, php: '8.4', image: 'mariadb:10.11', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '5.1', database: pgsql, branch: MOODLE_501_STABLE, php: '8.4', image: 'postgres:15', health: 'pg_isready -U postgres'}
          - {moodle: '5.1', database: mariadb, branch: MOODLE_501_STABLE, php: '8.4', image: 'mariadb:10.11', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '5.2', database: pgsql, branch: MOODLE_502_STABLE, php: '8.4', image: 'postgres:16', health: 'pg_isready -U postgres'}
          - {moodle: '5.2', database: mariadb, branch: MOODLE_502_STABLE, php: '8.4', image: 'mariadb:10.11', health: 'mysqladmin ping -h 127.0.0.1'}
          - {moodle: '5.3', database: pgsql, branch: MOODLE_503_STABLE, php: '8.4', image: 'postgres:17', health: 'pg_isready -U postgres'}
          - {moodle: '5.3', database: mariadb, branch: MOODLE_503_STABLE, php: '8.4', image: 'mariadb:11.4', health: 'mariadb-admin ping -h 127.0.0.1'}

    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 5432:5432
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle with the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.branch }}

      - name: Add the development settings and start the fake service
        run: |
          moodle-plugin-ci add-config 'define("TOOL_SECBACKUP_DEVELOPER", ["trustedkeys" => ["PUAXw+hDiVqStwqnTRt+vJyYLM8uxJaMwM1V8Sr0Zgw="], "allowhttp" => true, "allowprivatehosts" => true, "skipnetworkchecks" => true]);'
          nohup php -S 127.0.0.1:8099 plugin/.dev/fakesec/router.php > "$RUNNER_TEMP/fakesec.log" 2>&1 &
          for _ in $(seq 1 20); do
            if php -r 'exit(@file_get_contents("http://127.0.0.1:8099/_fake/state") === false ? 1 : 0);'; then
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/fakesec.log"
          exit 1

      # moodle-plugin-ci knows the profiles chrome and firefox. Edge is added to config.php, and the Behat site is enabled
      # again so that behat.yml has the profile. SECBK_BEHAT_TIMEOUT_FACTOR is not set on GitHub; .dev/ci/act.sh sets it,
      # because Edge runs emulated (amd64 on Apple silicon) under act and needs longer time limits there.
      - name: Add the Edge profile
        if: matrix.browser == 'edge'
        env:
          TIMEOUT_FACTOR: ${{ env.SECBK_BEHAT_TIMEOUT_FACTOR }}
        run: |
          if [ -n "$TIMEOUT_FACTOR" ]; then
            moodle-plugin-ci add-config "\$CFG->behat_increasetimeout = $TIMEOUT_FACTOR;"
          fi
          # shellcheck disable=SC2016
          moodle-plugin-ci add-config '$CFG->behat_profiles["edge"] = ["browser" => "MicrosoftEdge", "wd_host" => "http://localhost:4444/wd/hub", "capabilities" => ["browserName" => "MicrosoftEdge"]];'
          if [ -d moodle/public ]; then cli=moodle/public/admin/tool/behat/cli; else cli=moodle/admin/tool/behat/cli; fi
          php "$cli/util_single_run.php" --enable --add-core-features-to-theme

      - name: Behat features
        id: behat
        env:
          PHP_CLI_SERVER_WORKERS: '4'
        run: moodle-plugin-ci behat --profile ${{ matrix.browser }} --selenium selenium/standalone-${{ matrix.browser }}:4 --auto-rerun 0

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Behat Faildump ${{ matrix.browser }} Moodle ${{ matrix.moodle }} PHP ${{ matrix.php }} ${{ matrix.database }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

  # Behat in Safari, on a macOS runner (the newest image GitHub lists: macos-26, Apple silicon, Safari 26). There is no
  # Docker on it, so the databases come from Homebrew, at the lowest version that Homebrew still has and that the Moodle
  # version supports; the web server is the one of PHP, and safaridriver is the one of macOS.
  behat-safari:
    name: Behat safari Moodle ${{ matrix.moodle }} PHP ${{ matrix.php }} ${{ matrix.database }}
    runs-on: macos-26
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        moodle: ['4.5', '5.0', '5.1', '5.2', '5.3']
        database: [pgsql, mariadb]
        include:
          - {moodle: '4.5', database: pgsql, branch: MOODLE_405_STABLE, php: '8.3', formula: 'postgresql@15'}
          - {moodle: '4.5', database: mariadb, branch: MOODLE_405_STABLE, php: '8.3', formula: 'mariadb@10.6'}
          - {moodle: '5.0', database: pgsql, branch: MOODLE_500_STABLE, php: '8.4', formula: 'postgresql@15'}
          - {moodle: '5.0', database: mariadb, branch: MOODLE_500_STABLE, php: '8.4', formula: 'mariadb@10.11'}
          - {moodle: '5.1', database: pgsql, branch: MOODLE_501_STABLE, php: '8.4', formula: 'postgresql@15'}
          - {moodle: '5.1', database: mariadb, branch: MOODLE_501_STABLE, php: '8.4', formula: 'mariadb@10.11'}
          - {moodle: '5.2', database: pgsql, branch: MOODLE_502_STABLE, php: '8.4', formula: 'postgresql@16'}
          - {moodle: '5.2', database: mariadb, branch: MOODLE_502_STABLE, php: '8.4', formula: 'mariadb@10.11'}
          - {moodle: '5.3', database: pgsql, branch: MOODLE_503_STABLE, php: '8.4', formula: 'postgresql@17'}
          - {moodle: '5.3', database: mariadb, branch: MOODLE_503_STABLE, php: '8.4', formula: 'mariadb@11.4'}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      # Homebrew has no PostgreSQL 13, and PostgreSQL 14 is deprecated there and is disabled on 2026-11-12, so Moodle 4.5
      # and 5.0 run on PostgreSQL 15 here (their minimums are 13 and 14; ci.yml's services use those). MariaDB 10.6 (Moodle
      # 4.5) is deprecated in Homebrew since 2026-06-01 and has no disable date yet; it is 10.6.x here, not 10.6.7. The
      # other versions are the same as in the services of the other jobs.
      - name: Install and start the database
        env:
          FORMULA: ${{ matrix.formula }}
          DATABASE: ${{ matrix.database }}
        run: |
          brew install "$FORMULA"
          prefix="$(brew --prefix "$FORMULA")"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          export PATH="$prefix/bin:$PATH"
          brew services start "$FORMULA"
          if [ "$DATABASE" = pgsql ]; then
            for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 && break; sleep 2; done
            pg_isready -h 127.0.0.1 || { echo "PostgreSQL did not answer on 127.0.0.1." >&2; exit 1; }
            createuser -h 127.0.0.1 -s postgres
          else
            for _ in $(seq 1 30); do mariadb-admin ping -h 127.0.0.1 --silent && break; sleep 2; done
            mariadb-admin ping -h 127.0.0.1 --silent || { echo "MariaDB did not answer on 127.0.0.1." >&2; exit 1; }
            # Moodle connects as root without a password, over TCP. If root cannot do that yet, the account that Homebrew
            # made for the runner (it logs in through the socket) gives root an empty password. A failure here stops the job.
            if ! mariadb -u root -h 127.0.0.1 -e 'select 1' > /dev/null 2>&1; then
              mariadb -e "ALTER USER 'root'@'localhost' IDENTIFIED VIA mysql_native_password USING PASSWORD('');"
            fi
            mariadb -u root -h 127.0.0.1 -e 'select 1' > /dev/null \
              || { echo "root cannot log in to MariaDB over TCP without a password." >&2; exit 1; }
          fi

      - name: Install moodle-plugin-ci
        run: |
          brew install nvm
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          echo "NVM_DIR=$(brew --prefix nvm)" >> "$GITHUB_ENV"

      - name: Install Moodle with the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.branch }}

      - name: Add the development settings and start the fake service
        run: |
          moodle-plugin-ci add-config 'define("TOOL_SECBACKUP_DEVELOPER", ["trustedkeys" => ["PUAXw+hDiVqStwqnTRt+vJyYLM8uxJaMwM1V8Sr0Zgw="], "allowhttp" => true, "allowprivatehosts" => true, "skipnetworkchecks" => true]);'
          nohup php -S 127.0.0.1:8099 plugin/.dev/fakesec/router.php > "$RUNNER_TEMP/fakesec.log" 2>&1 &
          for _ in $(seq 1 20); do
            if php -r 'exit(@file_get_contents("http://127.0.0.1:8099/_fake/state") === false ? 1 : 0);'; then
              exit 0
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/fakesec.log"
          exit 1

      # safaridriver answers at /session, without the /wd/hub of Selenium.
      - name: Add the Safari profile
        run: |
          # shellcheck disable=SC2016
          moodle-plugin-ci add-config '$CFG->behat_profiles["safari"] = ["browser" => "safari", "wd_host" => "http://localhost:4444", "capabilities" => ["browserName" => "safari"]];'
          if [ -d moodle/public ]; then cli=moodle/public/admin/tool/behat/cli; else cli=moodle/admin/tool/behat/cli; fi
          php "$cli/util_single_run.php" --enable --add-core-features-to-theme

      # moodle-plugin-ci would start Selenium in Docker for the install's setting MOODLE_START_BEHAT_SERVERS, so it is told
      # not to, and the two servers are started here: safaridriver, and the web server of PHP with several workers (a page
      # asks for many files at once).
      - name: Start safaridriver and the web server of the Behat site
        run: |
          sudo safaridriver --enable
          nohup safaridriver -p 4444 > "$RUNNER_TEMP/safaridriver.log" 2>&1 &
          if [ -d moodle/public ]; then root=moodle/public; else root=moodle; fi
          PHP_CLI_SERVER_WORKERS=4 nohup php -S localhost:8000 -t "$root" > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:4444/status > /dev/null && curl -s -o /dev/null http://localhost:8000/; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/safaridriver.log" "$RUNNER_TEMP/web.log"
          exit 1

      - name: Behat features
        id: behat
        env:
          MOODLE_START_BEHAT_SERVERS: 'NO'
        run: moodle-plugin-ci behat --profile safari --auto-rerun 0

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Behat Faildump safari Moodle ${{ matrix.moodle }} PHP ${{ matrix.php }} ${{ matrix.database }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

  coverage:
    name: Line coverage of all combinations
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the coverage of every combination
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-run-*
          path: ${{ runner.temp }}/coverage

      # The merge always writes the numbers it counted, also when it finds lines that no run executed. The step after
      # the upload fails the job in that case.
      - name: Merge the coverage
        id: merge
        run: |
          bash .dev/coverage/shipped_files.sh > "$RUNNER_TEMP/shipped.txt"
          mkdir -p "$RUNNER_TEMP/summary"
          status=0
          # The file names have no spaces: they are made from the names of the artifacts above.
          # shellcheck disable=SC2046
          php .dev/coverage/merge.php --shipped="$RUNNER_TEMP/shipped.txt" \
            --summary="$RUNNER_TEMP/summary/coverage-summary.json" \
            $(find "$RUNNER_TEMP/coverage" -name '*.xml' -o -name '*.json' | sort) || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload the coverage summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: ${{ runner.temp }}/summary/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Require 100%
        env:
          MERGE_STATUS: ${{ steps.merge.outputs.status }}
        run: exit "$MERGE_STATUS"

  # The access control that the OS ships, tested in real virtual machines (Lima with QEMU and KVM, on the x86_64 runner):
  # SELinux on Rocky Linux and AlmaLinux, AppArmor on Debian and Ubuntu. Each job builds one machine from the distribution's
  # own packages, copies the plugin in, runs the connection diagnostics from the web server and from the command line in each
  # state of the access control, and compares the results with .dev/secureos/expect.txt. The same script runs on a Mac
  # (.dev/secureos/README.md). The secret SECBK_SECUREOS_ENDPOINT holds the connection URL of a real service. Without it (a
  # fork, or until a maintainer sets it) the stand-in expectations are checked. The log has the summary lines (case, check,
  # result), never the URL or any detail text, and the job uploads no artifact.
  secureos:
    name: Secure OS ${{ matrix.template }} ${{ matrix.state }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - {template: rocky-9, state: selinux}
          - {template: rocky-10, state: selinux}
          - {template: almalinux-9, state: selinux}
          - {template: almalinux-10, state: selinux}
          - {template: debian-12, state: standard}
          - {template: debian-12, state: confined}
          - {template: debian-13, state: standard}
          - {template: debian-13, state: confined}
          - {template: ubuntu-22.04, state: standard}
          - {template: ubuntu-22.04, state: confined}
          - {template: ubuntu-24.04, state: standard}
          - {template: ubuntu-24.04, state: confined}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs QEMU and Lima. The download of Lima is verified with `gh attestation verify` and the token of this job.
      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
        with:
          version: v2.2.1
          ssh: false

      # No set -x here: the connection URL is in the environment of this step.
      - name: Test the access control of ${{ matrix.template }} (${{ matrix.state }})
        env:
          SECBK_SECUREOS_ENDPOINT: ${{ secrets.SECBK_SECUREOS_ENDPOINT }}
          TEMPLATE: ${{ matrix.template }}
          STATE: ${{ matrix.state }}
        run: bash .dev/secureos/run-template.sh -s "$STATE" "$TEMPLATE"
